name: feishu-notify

# Claude 每天把判断写进 reviews/ 后，自动推送到飞书群。
# 设置：仓库 Settings → Secrets and variables → Actions → New repository secret
#   名字 FEISHU_WEBHOOK，值是飞书群「自定义机器人」的 Webhook 地址
#   如果机器人开了「签名校验」，再加一个 FEISHU_SECRET
on:
  push:
    branches: [main]
    paths: ["reviews/**.md"]
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - run: python scripts/feishu_notify.py
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          FEISHU_SECRET: ${{ secrets.FEISHU_SECRET }}
