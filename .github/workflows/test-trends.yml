name: test-trends
on:
  workflow_dispatch:   # 在 Actions 页面手动点 Run workflow 运行
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python test_trends.py
