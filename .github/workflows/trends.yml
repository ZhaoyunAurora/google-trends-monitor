name: trends-monitor

# 代码在这个公开仓库，抓取结果写到私有仓库（默认 <你的用户名>/google-trends-data），外人看不到。
# 需要的 Secret（Settings → Secrets and variables → Actions）：
#   DATA_REPO_TOKEN  能写私有数据仓库的令牌（必填，没有就不运行）
#   FEISHU_WEBHOOK   飞书群机器人地址（可选，有就推送新词提醒）
#   FEISHU_SECRET    飞书机器人签名密钥（可选）
on:
  schedule:
    # UTC 时间。每小时跑一次、每次 50 分钟（公开仓库运行时间不限）。
    - cron: "7 * * * *"
  workflow_dispatch:
    inputs:
      minutes:
        description: "本次最多跑几分钟"
        default: "50"
      test_feishu:
        description: "只发一条飞书测试消息，不抓取"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: trends-monitor
  cancel-in-progress: false

env:
  DATA_REPO: ${{ github.repository_owner }}/google-trends-data

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - name: 检查令牌
        id: check
        env:
          TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::warning::还没有设置 DATA_REPO_TOKEN，本次不运行（结果不能写到公开仓库）"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.check.outputs.ok == 'true'
        uses: actions/checkout@v4
      - if: steps.check.outputs.ok == 'true'
        uses: actions/checkout@v4
        with:
          repository: ${{ env.DATA_REPO }}
          token: ${{ secrets.DATA_REPO_TOKEN }}
          path: store
      - if: steps.check.outputs.ok == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - if: steps.check.outputs.ok == 'true'
        run: pip install requests
      - name: 飞书测试
        if: github.event.inputs.test_feishu == 'true'
        run: python -c "from monitor import feishu; import sys; sys.exit(0 if feishu.send('【测试】Trends 新词提醒的飞书推送已连通，之后每小时有新词会推送到这里。') else 1)"
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          FEISHU_SECRET: ${{ secrets.FEISHU_SECRET }}
      - name: 抓取并复核
        if: steps.check.outputs.ok == 'true' && github.event.inputs.test_feishu != 'true'
        run: python -m monitor.run
        env:
          OUT_DIR: store
          QUIET: "1"
          RUN_MINUTES: ${{ github.event.inputs.minutes || '50' }}
          REQUEST_INTERVAL: "25"
          CANDIDATE_MIN: "300"
          ROTATE_PER_RUN: "10"
          MAX_DEPTH: "3"
          ROOT_SHARE: "0.35"
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          FEISHU_SECRET: ${{ secrets.FEISHU_SECRET }}
      - name: 结果提交到私有仓库
        if: always() && steps.check.outputs.ok == 'true' && github.event.inputs.test_feishu != 'true'
        working-directory: store
        run: |
          git config user.name "trends-bot"
          git config user.email "trends-bot@users.noreply.github.com"
          git add data reports 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -q -m "data: $(date -u +%F-%H%M)"
          for i in 1 2 3; do git pull -q --rebase && git push -q && break; sleep 5; done
