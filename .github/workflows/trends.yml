name: trends-monitor

# 代码在这个公开仓库，抓取结果写到私有仓库（默认 <你的用户名>/google-trends-data），外人看不到。
# 需要的 Secret（Settings → Secrets and variables → Actions）：
#   DATA_REPO_TOKEN  能写私有数据仓库的令牌（必填，没有就不运行）
#   FEISHU_WEBHOOK   飞书群机器人地址（可选，有就推送新词提醒）
#   FEISHU_SECRET    飞书机器人签名密钥（可选）
on:
  schedule:
    # GitHub 的定时触发很不准（实际几个小时才触发一次），所以改成「接力」：
    # 每次跑完约 12 分钟后自己触发下一次（换一台机器、新 IP）。这里的定时只当保险，接力断了会重新接上。
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      minutes:
        description: "本次最多跑几分钟"
        default: "12"
      test_feishu:
        description: "只发一条飞书测试消息，不抓取"
        type: boolean
        default: false

permissions:
  contents: read
  actions: write   # 用来触发下一次接力

concurrency:
  group: trends-monitor
  cancel-in-progress: false

env:
  DATA_REPO: ${{ github.repository_owner }}/google-trends-data

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: 检查令牌
        id: check
        env:
          TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::warning::还没有设置 DATA_REPO_TOKEN，本次不运行（结果不能写到公开仓库）"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.check.outputs.ok == 'true'
        uses: actions/checkout@v4
      - if: steps.check.outputs.ok == 'true'
        uses: actions/checkout@v4
        with:
          repository: ${{ env.DATA_REPO }}
          token: ${{ secrets.DATA_REPO_TOKEN }}
          path: store
      - if: steps.check.outputs.ok == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - if: steps.check.outputs.ok == 'true'
        run: pip install requests
      - name: 飞书测试
        if: github.event.inputs.test_feishu == 'true'
        run: python -c "from monitor import feishu; import sys; sys.exit(0 if feishu.send('【测试】Trends 新词提醒的飞书推送已连通，之后每小时有新词会推送到这里。') else 1)"
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          FEISHU_SECRET: ${{ secrets.FEISHU_SECRET }}
      - name: 抓取并复核
        id: scrape
        if: steps.check.outputs.ok == 'true' && github.event.inputs.test_feishu != 'true'
        run: python -m monitor.run
        env:
          OUT_DIR: store
          QUIET: "1"
          RUN_MINUTES: ${{ github.event.inputs.minutes || '12' }}
          REQUEST_INTERVAL: "25"
          CANDIDATE_MIN: "300"
          ROTATE_PER_RUN: "5"
          ROTATE_DAYS: "3"
          MAX_DEPTH: "3"
          ROOT_SHARE: "0.35"
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          FEISHU_SECRET: ${{ secrets.FEISHU_SECRET }}
      - name: 结果提交到私有仓库
        if: always() && steps.check.outputs.ok == 'true' && github.event.inputs.test_feishu != 'true'
        working-directory: store
        run: |
          git config user.name "trends-bot"
          git config user.email "trends-bot@users.noreply.github.com"
          git add data reports 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -q -m "data: $(date -u +%F-%H%M)"
          for i in 1 2 3; do git pull -q --rebase && git push -q && break; sleep 5; done
      - name: 接力：触发下一次运行
        # 只有抓取成功才接力，避免程序出错时无限快速重跑
        if: always() && steps.scrape.outcome == 'success' && vars.CHAIN != 'off'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 已经有排队中的就不重复触发
          queued=$(gh run list -R "$GITHUB_REPOSITORY" -w trends.yml -s queued --json databaseId -q 'length')
          pending=$(gh run list -R "$GITHUB_REPOSITORY" -w trends.yml -s pending --json databaseId -q 'length')
          if [ "$queued" = "0" ] && [ "$pending" = "0" ]; then
            gh workflow run trends.yml -R "$GITHUB_REPOSITORY" --ref main
            echo "已触发下一次"
          else
            echo "已有排队中的运行，跳过"
          fi
